<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>About | Dead Flowers Dispensary</title>
  <meta name="description" content="The story behind Dead Flowers Dispensary in Palmer Lake, Colorado.">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-title-key="title.about">
  <div id="site-header"></div>

  <main id="main">
    <section class="page-head">
      <div class="wrap">
        <span class="kicker" data-i18n="about.kicker"></span>
        <h1 data-i18n="about.title"></h1>
        <p data-i18n="about.intro"></p>
      </div>
    </section>

    <section class="section">
      <div class="wrap story">
        <p class="story-lead" data-i18n="about.story1"></p>
        <p data-i18n="about.story2"></p>
        <p data-i18n="about.story3"></p>
      </div>
    </section>

    <section class="section section-tight">
      <div class="wrap">
        <div class="pillars">
          <div class="pillar" style="--c: var(--orange)">
            <h3 data-i18n="about.p1Title"></h3>
            <p data-i18n="about.p1"></p>
          </div>
          <div class="pillar pin-yellow" style="--c: var(--yellow)">
            <h3 data-i18n="about.p2Title"></h3>
            <p data-i18n="about.p2"></p>
          </div>
          <div class="pillar pin-pink" style="--c: var(--pink)">
            <h3 data-i18n="about.p3Title"></h3>
            <p data-i18n="about.p3"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="section section-tight">
      <div class="wrap">
        <div class="section-head">
          <span class="kicker" data-i18n="about.galleryKicker"></span>
          <h2 data-i18n="about.galleryTitle"></h2>
        </div>
        <!-- Store photos live in assets/img/store. The first one shows large. -->
        <div class="gallery">
          <img src="assets/img/store/murals.jpg" data-i18n-alt="about.photo1" loading="lazy" width="1600" height="1201">
          <img src="assets/img/store/counter.jpg" data-i18n-alt="about.photo2" loading="lazy" width="1200" height="901">
          <img src="assets/img/store/records.jpg" data-i18n-alt="about.photo3" loading="lazy" width="1200" height="901">
        </div>
      </div>
    </section>

    <section class="section exclusive">
      <div class="wrap serves" style="text-align:left">
        <div>
          <span class="kicker" data-i18n="about.servesKicker"></span>
          <h2 style="background:none;color:var(--text);font-size:clamp(2rem,4.2vw,3.2rem)" data-i18n="about.servesTitle"></h2>
        </div>
        <div>
          <p style="margin:0 0 20px;max-width:none" data-i18n="about.serves"></p>
          <div class="visit-actions">
            <a class="btn btn-primary" href="#" data-jane="rec" data-i18n="nav.shopRec"></a>
            <a class="btn btn-green" href="#" data-jane="med" data-i18n="nav.shopMed"></a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/site-data.js"></script>
  <script src="assets/js/merch-data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/paint.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
