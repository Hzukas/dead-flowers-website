<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merch | Dead Flowers Dispensary</title>
  <meta name="description" content="Dead Flowers Speed &amp; Supply: shirts and gear from Palmer Lake, Colorado. Ships worldwide.">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-title-key="title.merch">
  <div id="site-header"></div>

  <main id="main">
    <section class="section" style="padding-top:clamp(32px,5vw,64px)">
      <div class="wrap">
        <div class="catalog">
          <div class="stamp" data-i18n="merch.stamp"></div>
          <header class="catalog-head">
            <div class="top">
              <span data-i18n="merch.catalogTop"></span>
              <span>Palmer Lake, Colo.</span>
            </div>
            <h1 data-i18n="merch.catalogTitle"></h1>
            <div class="catalog-no" data-i18n="merch.catalogNo"></div>
            <div class="catalog-meta">
              <span data-i18n="merch.shipping"></span>
              <span data-i18n="merch.inHouse"></span>
              <span data-i18n="merch.final"></span>
            </div>
          </header>

          <div class="parts-grid" data-merch-grid></div>

          <footer class="catalog-foot">
            <span data-i18n="merch.footnote"></span>
            <span>Form DF-77 &middot; Rev. 2026</span>
          </footer>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/site-data.js"></script>
  <script src="assets/js/merch-data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/merch.js"></script>
</body>
</html>
